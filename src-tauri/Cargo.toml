[package]
name = "cyberctf-desktop"
version = "0.1.2"
description = "CyberCTF desktop launcher: runs Docker and VM labs locally"
authors = ["Cyber-Courses"]
license = ""
repository = "https://github.com/Cyber-Courses/Cyber-CTF-Desktop"
edition = "2024"
rust-version = "1.90"

[lib]
name = "cyberctf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "time", "net"] }
thiserror = "2"
sha2 = "0.11.0"
base64 = "0.23.1"
rand = "0.10.3"
url = "2.5.8"
flate2 = "1.1.10"
tar = "0.4.46"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.13", features = ["json", "form"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
