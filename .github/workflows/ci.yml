name: CI

# Every pull request and push to main: the frontend (build, types, lint, format, tests) and the
# Rust core (format, lint, tests) on Linux, macOS and Windows, so platform-specific code is at
# least compiled and tested on its own platform.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The static export; it also generates the route types tsc checks against.
      - run: pnpm build
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint src
      - run: pnpm exec prettier --check "src/**/*.{ts,tsx,css}"
      - run: pnpm exec vitest run

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libxdo-dev build-essential libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      # Tests don't need the real frontend, but the app embeds ../out at compile time.
      - name: Placeholder frontend
        shell: bash
        run: mkdir -p out && echo '<!doctype html>' > out/index.html
      - name: Format
        if: startsWith(matrix.os, 'ubuntu')
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
